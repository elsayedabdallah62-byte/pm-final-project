<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RouteLogic – One-Click Compliance Checklist</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#0f172a;font:16px system-ui,sans-serif}header{background:white;border-bottom:1px solid #dbe3ef}header div,main{max-width:1100px;margin:auto;padding:20px}header div{display:flex;justify-content:space-between}small,.muted{color:#64748b}h1{font-size:28px;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,table,.panel{background:white;border:1px solid #dbe3ef;border-radius:12px;padding:20px;margin-bottom:18px}.card strong{display:block;font-size:25px}table{width:100%;border-spacing:0;padding:0;overflow:hidden}td,th{text-align:left;padding:16px;border-bottom:1px solid #dbe3ef}th{color:#64748b}button{border:0;border-radius:8px;background:#0f172a;color:white;padding:13px 18px;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.back{background:white;color:#0f172a;border:1px solid #dbe3ef}label.field{display:block;margin-bottom:18px;font-weight:500}input:not([type=checkbox]),select{display:block;width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:8px;margin-top:7px;font:inherit;background:white}input.bad,select.bad{border:2px solid #dc2626}.err,.required{color:#dc2626}.err{display:block;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:5px;background:#fee2e2;color:#dc2626}.complete{background:#0f172a;color:white}.row{display:flex;justify-content:space-between;align-items:baseline}.done{max-width:560px;margin:auto;text-align:center}.done p{line-height:1.6}.check{display:flex;gap:10px;align-items:center}@media(max-width:600px){.cards{grid-template-columns:1fr}td,th{padding:8px;font-size:13px}.row{display:block}}</style><header><div><b>RouteLogic <span class="muted" style="font-weight:400">Velocity</span></b><span class="muted">Fleet Coordinator</span></div></header><main id="app"></main><script>
const fields=[['vehicleId','Vehicle ID','text',true,v=>/^TRK-\d{3}$/.test(v)?'':'Format must be TRK-###'],['driverName','Driver name','text',true],['licenseNumber','Driver license number','text',true,v=>v.length>=6?'':'Must be at least 6 characters'],['licenseExpiry','License expiry date','date',true,v=>new Date(v)>new Date()?'':'License is expired'],['odometer','Odometer (km)','number',true,v=>Number(v)>0?'':'Must be a positive number'],['inspection','Pre-trip inspection result','select',true,v=>v==='Pass'?'':'Vehicle must pass inspection to dispatch'],['insurancePolicy','Insurance policy number','text',true],['hoursOfService','Driver hours available today','number',true,v=>Number(v)>=0&&Number(v)<=14?'':'Must be between 0 and 14'],['notes','Notes','text',false]];
const values={vehicleId:'TRK-204',driverName:'Maria Lopez',licenseNumber:'DL-889213',licenseExpiry:'2028-03-14',odometer:'84213',inspection:'Pass',insurancePolicy:'',hoursOfService:'9',notes:''};let verified=false,submitted=false,started=0,elapsed=0;const app=document.getElementById('app');const error=f=>!values[f[0]].trim()?(f[3]?'This field is required':''):(f[4]?.(values[f[0]])||'');
function dash(){app.innerHTML=`<h1>Dispatch Dashboard</h1><div class="cards"><div class="card"><small>Active routes</small><strong>3</strong></div><div class="card"><small>Total stops</small><strong>41</strong></div><div class="card"><small>Daily compliance</small><br><span class="badge ${submitted?'complete':''}">${submitted?'Completed':'Pending'}</span></div></div><table><thead><tr><th>Route</th><th>Driver</th><th>Stops</th><th>Status</th></tr></thead><tbody><tr><td>R-12 Downtown</td><td>Maria Lopez</td><td>18</td><td>On time</td></tr><tr><td>R-07 Airport</td><td>James Kim</td><td>9</td><td>Delayed</td></tr><tr><td>R-21 Harbor</td><td>Aisha Bello</td><td>14</td><td>On time</td></tr></tbody></table><button id="start" ${submitted?'disabled':''}>${submitted?'Checklist already submitted today':'Start Compliance Checklist'}</button>`;document.getElementById('start').onclick=()=>{if(!submitted){started=Date.now();form()}}}
function form(){app.innerHTML='<div class="row"><h1>Daily Compliance Checklist</h1><span id="count" class="muted"></span></div><p class="muted">Fields are pre-filled from available data. Review and correct anything inaccurate. <span class="required">*</span> = mandatory.</p><div class="panel" id="fields"></div><label class="panel check"><input id="verify" type="checkbox"> I have reviewed all information above and confirm it is accurate and compliant.</label><button class="back" id="back">Back</button> <button id="submit">Submit Checklist</button>';for(const f of fields){const l=document.createElement('label');l.className='field';l.textContent=f[1];if(f[3]){const s=document.createElement('span');s.className='required';s.textContent=' *';l.append(s)}if(f[0]==='insurancePolicy'){const s=document.createElement('small');s.textContent=' (no data available – enter manually)';l.append(s)}const i=document.createElement(f[2]==='select'?'select':'input');i.id=f[0];if(f[2]==='select'){for(const o of ['','Pass','Fail'])i.add(new Option(o||'Select…',o))}else i.type=f[2];i.value=values[f[0]];i.oninput=()=>{values[f[0]]=i.value;verified=false;update()};l.append(i);const e=document.createElement('span');e.className='err';e.id='err-'+f[0];l.append(e);document.getElementById('fields').append(l)}document.getElementById('verify').onchange=e=>{verified=e.target.checked;update()};document.getElementById('back').onclick=dash;document.getElementById('submit').onclick=()=>{if(submitted||!verified||fields.some(error))return;submitted=true;elapsed=Date.now()-started;done()};update()}
function update(){let n=0;for(const f of fields){const e=error(f);if(e)n++;document.getElementById(f[0]).classList.toggle('bad',!!e);document.getElementById('err-'+f[0]).textContent=e}document.getElementById('count').textContent=`${fields.length-n}/${fields.length} fields valid`;document.getElementById('verify').checked=verified;document.getElementById('submit').disabled=!!n||!verified||submitted}
function done(){app.innerHTML=`<div class="panel done"><div style="font-size:44px">✓</div><h1>Checklist submitted</h1><p class="muted">Your daily compliance checklist was validated and submitted successfully.</p><p>Completion time: <b>${Math.floor(elapsed/60000)}m ${Math.floor(elapsed%60000/1000)}s</b> <span class="muted">(baseline 14m 36s)</span></p><p>Compliance status: <b>Completed</b></p><button id="return">Return to Dashboard</button></div>`;document.getElementById('return').onclick=dash}dash();</script></html>
